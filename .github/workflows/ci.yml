name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No tracked files under data/
        run: |
          if git ls-files data/ | grep -q .; then
            echo "error: tracked file(s) under data/ — this repo is public"
            git ls-files data/
            exit 1
          fi
      - name: Real-export fixtures pass the sanitised-fixture guard
        run: python3 scripts/check_real_fixtures.py
      - name: Model roster schema and stale-row warnings
        run: python3 scripts/check_model_roster.py
      - name: Whitespace and line endings
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git diff --check "origin/$BASE...HEAD"
      - name: Worklog entry files are well formed
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_worklog.py
      - name: Pull request adds a worklog entry file
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: python3 scripts/check_worklog.py --base "origin/$BASE"

  test:
    # Both platforms, because three of #45's four causes were invisible on
    # Linux: locale-encoded subprocess output, text-mode newline translation,
    # and TOML backslash escapes only bite on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  browser:
    runs-on: ubuntu-latest
    env:
      VAULT_CLEANER_BROWSER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Prove non-editable wheel installation
        run: python scripts/check_wheel_install.py
      - name: Run real-browser acceptance
        run: >-
          pytest -q -m browser
          --browser chromium
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --output=test-results
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-failure
          path: test-results
          if-no-files-found: ignore
