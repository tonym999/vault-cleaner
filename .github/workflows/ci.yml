name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms, because three of #45's four causes were invisible on
    # Linux: locale-encoded subprocess output, text-mode newline translation,
    # and TOML backslash escapes only bite on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
