# --- Roster --------------------------------------------------------------
# standing = "primary": a regular choice for the role or rung.
# standing = "alternative": permitted, not in regular use.
# effort_when_needed: the higher level the policy allows when the ticket
# needs it.

# Planner
[[assignments]]
role = "planner"
standing = "primary"
model = "gpt-6.1-sol"
effort = "high"
effort_when_needed = "xhigh"

